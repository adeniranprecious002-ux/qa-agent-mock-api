<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QA-Agent Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --pass: #3fb950;
    --medium: #d29922;
    --high: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 13px; }
  .stats {
    display: flex;
    gap: 16px;
    margin: 24px 0;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    flex: 1;
  }
  .stat-card .num { font-size: 28px; font-weight: 600; }
  .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.pass { background: rgba(63,185,80,0.15); color: var(--pass); }
  .badge.medium { background: rgba(210,153,34,0.15); color: var(--medium); }
  .badge.high { background: rgba(248,81,73,0.15); color: var(--high); }
  .config-warning {
    background: #3d2f00;
    border: 1px solid var(--medium);
    color: #f0c674;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>QA-Agent — Live Check Results</h1>
<p class="sub">Reads directly from the qa_checks table in Supabase.</p>

<div id="config-warning" class="config-warning" style="display:none;">
  Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script before this will load data.
</div>

<div class="stats">
  <div class="stat-card"><div class="num" id="stat-total">–</div><div class="label">Checks (24h)</div></div>
  <div class="stat-card"><div class="num" id="stat-pass">–</div><div class="label">Pass Rate</div></div>
  <div class="stat-card"><div class="num" id="stat-anomalies">–</div><div class="label">Anomalies</div></div>
</div>

<table>
  <thead>
    <tr>
      <th>Time</th><th>Endpoint</th><th>Status</th><th>Expected</th><th>Actual</th><th>Delta</th><th>Likely Cause</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
  // ---- Configure these two values ----
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
  // -------------------------------------

  async function loadChecks() {
    if (SUPABASE_URL.includes("YOUR-PROJECT")) {
      document.getElementById("config-warning").style.display = "block";
      return;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/qa_checks_recent`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const rows = await res.json();
    render(rows);
  }

  function render(rows) {
    const total = rows.length;
    const passCount = rows.filter(r => r.status === "pass").length;
    const anomalyCount = rows.filter(r => r.status === "anomaly").length;

    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-pass").textContent = total ? `${Math.round((passCount / total) * 100)}%` : "–";
    document.getElementById("stat-anomalies").textContent = anomalyCount;

    const tbody = document.getElementById("rows");
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${new Date(r.checked_at).toLocaleString()}</td>
        <td>${r.endpoint}</td>
        <td><span class="badge ${r.severity === 'none' ? 'pass' : r.severity}">${r.status}</span></td>
        <td>${r.expected_value ?? "–"}</td>
        <td>${r.actual_value ?? "–"}</td>
        <td>${r.delta ?? "–"}</td>
        <td>${r.ai_explanation?.likely_cause ?? "–"}</td>
      </tr>
    `).join("");
  }

  loadChecks();
  setInterval(loadChecks, 60000); // refresh every minute
</script>

</body>
</html>
